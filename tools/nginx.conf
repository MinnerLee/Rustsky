worker_processes 1;
daemon off;
pid .preview/nginx/rustsky.pid;
error_log .preview/nginx/error.log;

events {
    worker_connections 256;
}

http {
    include ../.preview/nginx/nginx-1.31.8/conf/mime.types;
    default_type application/octet-stream;
    access_log .preview/nginx/access.log;
    client_body_temp_path .preview/nginx/client_body_temp;
    proxy_temp_path .preview/nginx/proxy_temp;
    fastcgi_temp_path .preview/nginx/fastcgi_temp;
    uwsgi_temp_path .preview/nginx/uwsgi_temp;
    scgi_temp_path .preview/nginx/scgi_temp;

    upstream rustsky_api {
        server 127.0.0.1:8080;
        server 127.0.0.1:8081;
    }

    server {
        listen 127.0.0.1:8888;
        server_name localhost;
        root .preview/course/Web/nginx-1.20.2/html;

        location = / {
            return 302 /sky/;
        }

        location = /sky {
            return 302 /sky/;
        }

        location /sky/ {
            index index.html;
            try_files $uri $uri/ =404;
        }

        location = /api/order/events {
            proxy_pass http://rustsky_api/admin/order/events;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 45s;
        }

        location /api/ {
            client_max_body_size 3m;
            proxy_pass http://rustsky_api/admin/;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            add_header X-Rustsky-Upstream $upstream_addr always;
        }

        location /uploads/ {
            alias .preview/uploads/;
            add_header X-Content-Type-Options nosniff;
        }

        location /user/ {
            proxy_pass http://rustsky_api;
        }

        location = /notify/wechat/payment {
            client_max_body_size 32k;
            proxy_pass http://rustsky_api;
        }

        location = /openapi.json {
            proxy_pass http://rustsky_api;
        }

        location = /docs {
            return 302 /docs/;
        }

        location /docs/ {
            proxy_pass http://rustsky_api;
        }

        location = /health {
            proxy_pass http://rustsky_api;
        }

        location / {
            return 404;
        }
    }
}
