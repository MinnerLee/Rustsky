[package]
name = "Rustsky"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["now"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
rand_core = { version = "0.6", features = ["getrandom"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
rsa = { version = "0.9", features = ["sha2"] }
rust_xlsxwriter = "0.102"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio"] }
subtle = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread"] }
utoipa = "6"
utoipa-swagger-ui = { version = "10", default-features = false, features = ["axum", "vendored"] }
